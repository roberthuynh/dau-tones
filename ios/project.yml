# XcodeGen project for Dấu — Vietnamese tone trainer (two-layer: DauCore SPM + SwiftUI app).
# `xcodegen generate` after any file add/remove/rename; .xcodeproj is gitignored.
# Scaffolded from maple-hollow/templates/project/general (general category, NOT game).
#
# Local identity below is cosmetic: ship-testflight.py overrides PRODUCT_BUNDLE_IDENTIFIER
# and DEVELOPMENT_TEAM at archive time from apps.json (slug `dau` -> com.nookthrowaway.dau,
# team 6FX3LZM86V). Keep them honest anyway.
name: Dau
options:
  bundleIdPrefix: com.ninthtile
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 6FX3LZM86V
packages:
  DauCore:
    path: DauCore
targets:
  Dau:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources
    dependencies:
      - package: DauCore
        product: DauCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ninthtile.dau
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Dấu
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: >-
          Dấu grades your tones on this iPhone. Your voice is analyzed on-device and never
          uploaded — no account, no recordings leave the phone.
    scheme:
      testTargets: [DauTests, DauUITests]
  DauTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Dau
  DauUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Dau
